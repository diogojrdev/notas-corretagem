services:
  db:
    image: postgres:16
    container_name: notas-corretagem-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: notas
      POSTGRES_PASSWORD: notas_password
      POSTGRES_DB: notas_corretagem
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "notas", "-d", "notas_corretagem"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
