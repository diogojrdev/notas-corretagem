[project]
name = "notas-corretagem"
version = "0.1.0"
description = "Processamento de notas de corretagem (day trade) com painel de acompanhamento"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "streamlit>=1.38",
    "plotly>=5.24",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pytest>=8.3",
]

[project.scripts]
import-notas = "notas_corretagem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notas_corretagem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
